<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte Electoral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; padding-bottom: 50px; }
    .header { background: #003366; color: white; padding: 15px; text-align: center; font-weight: bold; }
    .card { margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="header">IPOSTEL - Elecciones España 2026</div>
  
  <div class="container">
    <!-- Alertas -->
    <div id="alerta" class="alert d-none mt-3"></div>

    <!-- Formulario -->
    <div class="card p-4" id="formulario" style="display:none;">
      <h4 id="tituloFormulario" class="mb-3"></h4>
      <form id="reporteForm">
        <input type="hidden" id="rolUsuario" name="rolUsuario">
        <input type="hidden" id="optUsuario" name="optUsuario">
        
        <!-- FASE I: OPERACIONES -->
        <div id="camposOperaciones" style="display:none;">
          <h5>Fase I: Recepción y Clasificación</h5>
          <div class="mb-3"><label>Guía Aérea/Postal</label><input type="text" class="form-control" name="guia"></div>
          <div class="mb-3"><label>Total Valijas/Sacas</label><input type="number" class="form-control" name="valijas"></div>
          <div class="mb-3"><label>Total Piezas</label><input type="number" class="form-control" name="piezas"></div>
          <div class="mb-3"><label>Novedades / Nudos Críticos</label><textarea class="form-control" name="novedades" rows="3"></textarea></div>
        </div>

        <!-- FASE II: CNC -->
        <div id="camposCNC" style="display:none;">
          <h5>Fase II: Control y Auditoría</h5>
          <div class="mb-3"><label>Estado a Reportar</label><input type="text" class="form-control" name="estado" placeholder="Ej: Anzoátegui"></div>
          <div class="mb-3"><label>Piezas Recibidas</label><input type="number" class="form-control" name="recibidas"></div>
          <div class="mb-3"><label>Piezas Entregadas</label><input type="number" class="form-control" name="entregadas"></div>
          <div class="mb-3"><label>Pendientes por Entregar</label><input type="number" class="form-control" name="pendientes"></div>
          <div class="mb-3"><label>Nudos Críticos (Opcional)</label><textarea class="form-control" name="nudos" rows="2"></textarea></div>
        </div>

        <!-- FASE III: JEFE OPT -->
        <div id="camposOPT" style="display:none;">
          <h5>Fase III: Reporte Diario de Oficina (OPT)</h5>
          <div class="mb-3"><label>Piezas Recibidas en OPT</label><input type="number" class="form-control" name="piezasRecibidas"></div>
          <div class="mb-3"><label>Entregas Efectivas</label><input type="number" class="form-control" name="entregas"></div>
          <div class="mb-3"><label>En Ruta / Pendientes</label><input type="number" class="form-control" name="pendientesOPT"></div>
          <div class="mb-3"><label>Incidencias (No encontrado / Dir. Errada)</label><input type="number" class="form-control" name="incidencias"></div>
          <div class="mb-3"><label>URL Evidencia Fotográfica (Drive/Telegram)</label><input type="text" class="form-control" name="evidencia"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Enviar Reporte</button>
      </form>
    </div>

    <!-- Panel CNC (Aprobaciones) -->
    <div class="card p-4 mt-4" id="panelCNC" style="display:none;">
      <h4>Aprobación de Reportes (CNC)</h4>
      <div id="listaAprobaciones" class="mt-3">Cargando...</div>
    </div>

  </div>

  <script>
    window.onload = function() {
      document.getElementById('alerta').className = 'alert alert-info mt-3';
      document.getElementById('alerta').innerText = 'Validando usuario...';
      
      google.script.run.withSuccessHandler(cargarInterfaz).getUserRole();
    };

    function cargarInterfaz(user) {
      const alerta = document.getElementById('alerta');
      if (user.error) {
        alerta.className = 'alert alert-danger mt-3';
        alerta.innerText = user.error;
        return;
      }
      alerta.className = 'd-none';
      document.getElementById('formulario').style.display = 'block';
      document.getElementById('rolUsuario').value = user.rol;
      document.getElementById('optUsuario').value = user.opt;
      document.getElementById('tituloFormulario').innerText = 'Bienvenido: ' + user.nombre + ' (' + user.rol + ')';

      if (user.rol === 'DIR_OPER') {
        document.getElementById('camposOperaciones').style.display = 'block';
      } else if (user.rol === 'DIR_CNC' || user.rol === 'COORD_CNC') {
        document.getElementById('camposCNC').style.display = 'block';
        document.getElementById('panelCNC').style.display = 'block';
        // Aquí podrías cargar los reportes pendientes de OPT para aprobar
      } else if (user.rol === 'JEFE_OPT') {
        document.getElementById('camposOPT').style.display = 'block';
      }
    }

    document.getElementById('reporteForm').onsubmit = function(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.innerText = 'Enviando...';
      
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        btn.disabled = false;
        btn.innerText = 'Enviar Reporte';
        if(res.success) e.target.reset();
      }).guardarReporte(data);
    };
  </script>
</body>
</html>
