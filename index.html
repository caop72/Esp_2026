<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPOSTEL — Elecciones España 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root { --ipostel-azul: #003366; --ipostel-rojo: #c8102e; --ipostel-amarillo: #ffc72c; --ipostel-gris: #f4f6f9; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; min-height: 100vh; background-color: var(--ipostel-gris); }
  #pantallaBienvenida { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--ipostel-azul) 0%, #001a33 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; transition: opacity 0.6s ease; }
  .logo-bienvenida { font-size: 4rem; margin-bottom: 20px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
  #pantallaBienvenida h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; text-align: center; line-height: 1.1; }
  #pantallaBienvenida h1 span { color: var(--ipostel-amarillo); display: block; font-size: 1.5rem; margin-top: 5px; letter-spacing: 2px; }
  #pantallaBienvenida p { font-size: 1.1rem; color: #a0aec0; margin-bottom: 40px; letter-spacing: 2px; }
  .btn-bienvenida { background: var(--ipostel-rojo); border: none; color: white; padding: 12px 50px; border-radius: 30px; font-weight: 700; font-size: 1.1rem; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(200, 16, 46, 0.4); }
  .btn-bienvenida:hover { background: #a00d25; color: white; transform: translateY(-2px); }
  #pantallaLogin { display: none; min-height: 100vh; padding: 40px 20px; background: linear-gradient(135deg, var(--ipostel-azul) 0%, #001a33 100%); }
  .card-ipostel { background: #fff; color: #222; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 100%; max-width: 600px; margin: auto; padding: 30px; border-top: 5px solid var(--ipostel-rojo); }
  .titulo { color: var(--ipostel-azul); font-weight: 800; margin-bottom: 0; }
  .subtitulo { color: #6c757d; font-size: 0.9rem; }
  .btn-ipostel { background: var(--ipostel-azul); color: #fff; font-weight: 600; border: none; padding: 12px; border-radius: 8px; transition: 0.3s; }
  .btn-ipostel:hover { background: #002244; color: var(--ipostel-amarillo); }
  .form-label { font-weight: 600; color: #444; font-size: 0.85rem; margin-bottom: 4px; }
  .form-control, .form-select { border-radius: 8px; border: 1px solid #ced4da; font-size: 0.95rem; }
  .form-control:focus, .form-select:focus { border-color: var(--ipostel-rojo); box-shadow: 0 0 0 0.25rem rgba(200, 16, 46, 0.25); }
  .oculto { display: none !important; }
  .box-clave { background: #f8f9fa; border-radius: 8px; padding: 15px; border: 1px solid #e9ecef; }
</style>
</head>
<body>

<div id="pantallaBienvenida">
  <div class="logo-bienvenida">🗳️</div> 
  <h1>OBSERVATORIO ESTRATÉGICO POSTAL <span>ELECCIONES DE ESPAÑA 2026</span></h1>
  <p>ODP 009-2026</p>
  <button class="btn btn-bienvenida" onclick="entrarAlSistema()">Ingresar al Sistema</button>
</div>

<div id="pantallaLogin">
  <div class="card card-ipostel">
    <div class="text-center mb-4">
      <h2 class="titulo">Control Electoral</h2>
      <span class="subtitulo">Seleccione su rol para continuar</span>
    </div>

    <div id="pasoRol" class="mb-3">
      <label class="form-label text-primary">Seleccione su Rol</label>
      <select id="selRol" class="form-select fw-bold" onchange="cambiarRol()">
        <option value="">-- Seleccione su rol --</option>
        <option value="JEFE_OPT">Jefe de OPT</option>
        <option value="OBSERVATORIO">Observatorio / Despacho</option>
      </select>
    </div>

    <div id="pasoEstado" class="mb-3 oculto">
      <label class="form-label">Estado</label>
      <select id="selEstado" class="form-select" onchange="cambiarEstado()">
        <option value="">-- Seleccione Estado --</option>
      </select>
    </div>

    <div id="pasoOPT" class="mb-3 oculto">
      <label class="form-label">Oficina Postal (OPT)</label>
      <select id="selOPT" class="form-select" onchange="verificarUsuario()">
        <option value="">-- Seleccione OPT --</option>
      </select>
    </div>

    <div id="pasoCredenciales" class="oculto">
      <div id="boxLoginExistente" class="mb-3 box-clave oculto">
        <label class="form-label">Clave de Acceso</label>
        <input id="inpClave" type="password" class="form-control" placeholder="••••">
      </div>
    </div>

    <div class="mt-3">
      <button id="btnIngresar" class="btn btn-ipostel w-100 mb-2 oculto" onclick="enviarAlBackend()">🔑 Ingresar al Sistema</button>
      <button id="btnVolver" class="btn btn-outline-secondary w-100 oculto" onclick="volverAtras()">⬅ Volver / Cancelar</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzx_AeJRGOOXphA0N5sUFEMJbDBwsyzfElr0hH38dmzUmFt9dy1NJ7w3MjMycrWzoI2/exec';
const estadoApp = { rol: null, requiereEstado: false, requiereOPT: false, estadoSel: null, optSel: null, subRolSel: null };
const ROLES_CON_ESTADO = ['JEFE_OPT'];
const ROLES_CON_OPT = ['JEFE_OPT'];

function ocultar(id) { document.getElementById(id).classList.add('oculto'); }
function mostrar(id) { document.getElementById(id).classList.remove('oculto'); }
function ocultarTodo() { ['pasoEstado', 'pasoOPT', 'pasoCredenciales', 'boxLoginExistente', 'btnIngresar', 'btnVolver'].forEach(id => ocultar(id)); }

function entrarAlSistema() {
  document.getElementById('pantallaBienvenida').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('pantallaBienvenida').style.display = 'none';
    document.getElementById('pantallaLogin').style.display = 'block';
  }, 600);
}

function cambiarRol() {
  const rol = document.getElementById('selRol').value;
  ocultarTodo();
  estadoApp.rol = rol; estadoApp.estadoSel = null; estadoApp.optSel = null;
  if (!rol) return;
  estadoApp.requiereEstado = ROLES_CON_ESTADO.includes(rol);
  estadoApp.requiereOPT = ROLES_CON_OPT.includes(rol);

  if (estadoApp.requiereEstado) {
    mostrar('pasoEstado'); mostrar('btnVolver'); cargarEstados();
  } else {
    mostrar('pasoCredenciales'); mostrar('boxLoginExistente'); mostrar('btnIngresar');
  }
}

function cambiarEstado() {
  estadoApp.estadoSel = document.getElementById('selEstado').value;
  ocultarTodo();
  if (!estadoApp.estadoSel) { mostrar('pasoEstado'); mostrar('btnVolver'); return; }
  if (estadoApp.requiereOPT) {
    mostrar('pasoEstado'); mostrar('pasoOPT'); mostrar('btnVolver'); cargarOPTs(estadoApp.estadoSel);
  } else {
    mostrar('pasoEstado'); mostrar('btnVolver'); verificarUsuario(); 
  }
}

async function verificarUsuario() {
  if (estadoApp.requiereOPT) {
    estadoApp.optSel = document.getElementById('selOPT').value;
    if (!estadoApp.optSel) { mostrar('pasoEstado'); mostrar('pasoOPT'); mostrar('btnVolver'); return; }
  }
  mostrar('pasoCredenciales'); mostrar('btnVolver');
}

async function enviarAlBackend() {
  const rol = estadoApp.rol;
  let payload = { accion: 'loginArbol', rol: rol, clave: document.getElementById('inpClave').value.trim() };
  
  if (estadoApp.requiereEstado) { payload.estado = estadoApp.estadoSel; }
  if (estadoApp.requiereOPT) { payload.codigoOPT = estadoApp.optSel; }

  const btn = document.getElementById('btnIngresar');
  btn.disabled = true; btn.textContent = 'Validando...';

  try {
    const resp = await postAPI(payload);
    if (!resp.exito) { Swal.fire('Acceso denegado', resp.mensaje || 'No autorizado', 'error'); btn.disabled = false; btn.textContent = '🔑 Ingresar al Sistema'; return; }
    redirigir(resp);
  } catch (err) { Swal.fire('Error de conexión', err.message, 'error'); btn.disabled = false; btn.textContent = '🔑 Ingresar al Sistema'; }
}

function redirigir(r) {
  const rol = r.rol || estadoApp.rol;
  sessionStorage.setItem('ipostel_rol', rol);
  sessionStorage.setItem('ipostel_usuario', r.usuario || 'Usuario');
  if (estadoApp.estadoSel) sessionStorage.setItem('ipostel_estado', estadoApp.estadoSel);
  if (estadoApp.optSel) sessionStorage.setItem('ipostel_opt', estadoApp.optSel);

  if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    window.location.replace('portal_opt.html');
  } else {
    window.location.replace('observatorio.html');
  }
}

function volverAtras() {
  if (!document.getElementById('pasoCredenciales').classList.contains('oculto')) {
    document.getElementById('pasoCredenciales').classList.add('oculto');
    if (estadoApp.requiereOPT) { mostrar('pasoEstado'); mostrar('pasoOPT'); }
    else if (estadoApp.requiereEstado) { mostrar('pasoEstado'); }
    else { document.getElementById('selRol').value = ''; cambiarRol(); }
    return;
  }
  if (!document.getElementById('pasoOPT').classList.contains('oculto')) { document.getElementById('pasoOPT').classList.add('oculto'); mostrar('pasoEstado'); return; }
  if (!document.getElementById('pasoEstado').classList.contains('oculto')) { document.getElementById('pasoEstado').classList.add('oculto'); document.getElementById('selRol').value = ''; cambiarRol(); return; }
  document.getElementById('selRol').value = ''; cambiarRol();
}

async function cargarEstados() {
  try {
    const r = await postAPI({accion: 'obtenerEstados'});
    if (r.exito) {
      const sel = document.getElementById('selEstado');
      sel.innerHTML = '<option value="">-- Seleccione Estado --</option>';
      r.estados.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
    }
  } catch(e) { console.error(e); }
}

async function cargarOPTs(estado) {
  try {
    const r = await postAPI({accion: 'obtenerOPTsPorEstado', estado: estado});
    if (r.exito) {
      const sel = document.getElementById('selOPT');
      sel.innerHTML = '<option value="">-- Seleccione OPT --</option>';
      r.opts.forEach(o => sel.innerHTML += `<option value="${o.codigo}">${o.nombre}</option>`);
      mostrar('pasoOPT');
    }
  } catch(e) { console.error(e); }
}

function postAPI(payload) {
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }).then(r => r.json());
}
</script>
</body>
</html>
