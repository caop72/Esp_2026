<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPOSTEL - Elecciones España 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; padding-bottom: 50px; }
    .header { background: #003366; color: white; padding: 15px; text-align: center; font-weight: bold; }
    .card { margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="header">IPOSTEL - Elecciones España 2026</div>
  <div class="container">
    
    <!-- LOGIN -->
    <div id="loginScreen" class="card p-4 mt-4">
      <h5 class="mb-3">Acceso al Sistema</h5>
      
      <div class="mb-3">
        <label>Tipo de Usuario</label>
        <select id="loginRol" class="form-select" onchange="actualizarCamposLogin()">
          <option value="DIR_CNC">Director CNC</option>
          <option value="COORD_CNC">Coordinador CNC</option>
          <option value="JEFE_OPT">Jefe de OPT</option>
          <option value="DESPACHO">Despacho / Observatorio</option>
        </select>
      </div>
      
      <div class="mb-3" id="divEstado" style="display:none;">
        <label>Estado</label>
        <select id="loginEstado" class="form-select" onchange="cargarOPTs()">
          <option value="">Cargando estados...</option>
        </select>
      </div>
      
      <div class="mb-3" id="divOpt" style="display:none;">
        <label>Oficina (OPT)</label>
        <select id="loginOpt" class="form-select">
          <option value="">Seleccione un estado primero</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Clave (4 dígitos)</label>
        <input type="password" id="loginClave" class="form-control" placeholder="****">
      </div>

      <button class="btn btn-primary w-100" onclick="ejecutarLogin()">Ingresar</button>
      <div id="loginAlert" class="alert alert-danger mt-3 d-none"></div>
    </div>

    <!-- APP -->
    <div id="appScreen" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
        <h5 id="lblBienvenida" class="m-0"></h5>
        <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">Salir</button>
      </div>

      <div class="card p-4" id="formulario">
        <form id="reporteForm">
          <div id="camposOPT" style="display:none;">
            <h5>Fase III: Reporte Diario (OPT)</h5>
            <div class="mb-3"><label>Piezas Recibidas</label><input type="number" class="form-control" name="piezasRecibidas" required></div>
            <div class="mb-3"><label>Entregas</label><input type="number" class="form-control" name="entregas" required></div>
            <div class="mb-3"><label>Pendientes</label><input type="number" class="form-control" name="pendientes" required></div>
            <div class="mb-3"><label>Incidencias</label><input type="number" class="form-control" name="incidencias" required></div>
            <div class="mb-3"><label>URL Foto</label><input type="url" class="form-control" name="evidencia" required></div>
            <button type="submit" class="btn btn-success w-100 mt-3">Enviar Reporte a CNC</button>
          </div>
        </form>
      </div>

      <div class="card p-4 mt-4" id="panelCNC" style="display:none;">
        <h5>Aprobación de Reportes OPT</h5>
        <div id="listaAprobaciones" class="mt-3">Cargando...</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzx_AeJRGOOXphA0N5sUFEMJbDBwsyzfElr0hH38dmzUmFt9dy1NJ7w3MjMycrWzoI2/exec'; 
    let userActual = {};

    // Cargar estados al inicio si eligen Jefe de OPT
    function actualizarCamposLogin() {
      const rol = document.getElementById('loginRol').value;
      const isOpt = (rol === 'JEFE_OPT');
      document.getElementById('divEstado').style.display = isOpt ? 'block' : 'none';
      document.getElementById('divOpt').style.display = isOpt ? 'block' : 'none';
      
      if (isOpt && document.getElementById('loginEstado').options.length <= 1) {
        cargarEstados();
      }
    }

    async function cargarEstados() {
      const select = document.getElementById('loginEstado');
      select.innerHTML = '<option value="">Cargando...</option>';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accion: 'obtenerEstados' })
        });
        const json = await res.json();
        if (json.exito) {
          select.innerHTML = '<option value="">Seleccione estado</option>';
          json.estados.forEach(est => {
            select.innerHTML += `<option value="${est}">${est}</option>`;
          });
        }
      } catch(e) { select.innerHTML = '<option value="">Error al cargar</option>'; }
    }

    async function cargarOPTs() {
      const estado = document.getElementById('loginEstado').value;
      const selectOpt = document.getElementById('loginOpt');
      if (!estado) { selectOpt.innerHTML = '<option value="">Seleccione un estado primero</option>'; return; }
      
      selectOpt.innerHTML = '<option value="">Cargando...</option>';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accion: 'obtenerOPTsPorEstado', estado: estado })
        });
        const json = await res.json();
        if (json.exito) {
          selectOpt.innerHTML = '<option value="">Seleccione OPT</option>';
          json.opts.forEach(opt => {
            selectOpt.innerHTML += `<option value="${opt.codigo}">${opt.nombre}</option>`;
          });
        }
      } catch(e) { selectOpt.innerHTML = '<option value="">Error al cargar</option>'; }
    }

    async function ejecutarLogin() {
      const rolSelect = document.getElementById('loginRol').value;
      const estado = document.getElementById('loginEstado').value;
      const opt = document.getElementById('loginOpt').value;
      const clave = document.getElementById('loginClave').value;
      
      const btn = document.querySelector('#loginScreen button');
      btn.innerText = 'Validando...';
      document.getElementById('loginAlert').classList.add('d-none');
      
      let payload = { accion: 'loginArbol', clave: clave };
      
      if (rolSelect === 'DIR_CNC') {
        payload.rol = 'DIRECCION'; payload.subRol = 'CNC';
      } else if (rolSelect === 'COORD_CNC') {
        payload.rol = 'COORDINADOR'; payload.subRol = 'CNC_MICRO';
      } else if (rolSelect === 'JEFE_OPT') {
        payload.rol = 'JEFE_OPT'; payload.estado = estado; payload.codigoOPT = opt;
      } else if (rolSelect === 'DESPACHO') {
        payload.rol = 'DESPACHO';
      }

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        
        if (json.exito) {
          userActual = json;
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('appScreen').style.display = 'block';
          document.getElementById('lblBienvenida').innerText = 'Rol: ' + json.rol + ' - Usuario: ' + (json.usuario || '');
          cargarInterfaz();
        } else {
          document.getElementById('loginAlert').innerText = json.mensaje;
          document.getElementById('loginAlert').classList.remove('d-none');
        }
      } catch(e) { 
        document.getElementById('loginAlert').innerText = 'Error de conexión: ' + e;
        document.getElementById('loginAlert').classList.remove('d-none');
      }
      btn.innerText = 'Ingresar';
    }

    function cargarInterfaz() {
      if (userActual.rol === 'JEFE_OPT' || userActual.rol === 'ANALISTA_OPT') {
        document.getElementById('camposOPT').style.display = 'block';
      } else if (userActual.rol === 'DIR_CNC' || userActual.rol === 'COORD_CNC') {
        document.getElementById('panelCNC').style.display = 'block';
        cargarPendientesCNC();
      } else if (userActual.rol === 'DESPACHO' || userActual.rol === 'OBSERVATORIO') {
        window.location.href = 'observatorio.html';
      }
    }

    async function cargarPendientesCNC() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accion: 'obtenerPendientesOPT' })
        });
        const json = await res.json();
        const div = document.getElementById('listaAprobaciones');
        
        if (!json.exito || !json.pendientes || json.pendientes.length === 0) {
          div.innerHTML = '<p class="text-muted">No hay reportes pendientes.</p>'; return; 
        }
        
        let html = '<table class="table table-sm"><thead><tr><th>OPT</th><th>Recib.</th><th>Entreg.</th><th>Pend.</th><th>Acción</th></tr></thead><tbody>';
        json.pendientes.forEach(item => {
          html += `<tr><td>${item.opt}</td><td>${item.recibidas}</td><td>${item.entregadas}</td><td>${item.pendientes}</td><td><button class="btn btn-sm btn-success" onclick="aprobar(${item.fila})">Aprobar</button></td></tr>`;
        });
        html += '</tbody></table>';
        div.innerHTML = html;
      } catch(e) { console.error(e); }
    }

    async function aprobar(fila) {
      if(!confirm('¿Aprobar este reporte?')) return;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ accion: 'aprobarReporteOPT', fila: fila })
        });
        const json = await res.json();
        alert(json.mensaje);
        if(json.exito) cargarPendientesCNC();
      } catch(e) { alert('Error: ' + e); }
    }
  </script>
</body>
</html>
